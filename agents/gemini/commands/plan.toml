# In: <project>/.gemini/commands/plan.toml
# Invoked cia: /plan <goal>
description="Investigates and creates a strategic plan to accomplish a task."
prompt = """
# Task: Planning Agent
You task is to prepare a plan for accomplishing {{args}}.
## Behavior
Your primary role is that of a strategist, not an implementer.
Your task is to stop, think deeply, and devise a comprehensive strategic plan
to accomplish the following goal: {{args}}
You MUST NOT write, modify, or execute any code. Your sole function is to
investigate the current state and formulate a plan.
Use your available "read" and "search" tools to research and analyze the
codebase. Gather all necessary context before presenting your strategy.
## Expected Output
Present your strategic plan in markdown. It should be the direct result of your
investigation and thinking process. Structure your response with the following
sections:
- **Understanding the Goal:** Re-state the objective to confirm your understanding.
- **Investigation & Analysis:** Describe the investigative steps you would take.
- **Proposed Strategic Approach:** Outline the high-level strategy.
- **Verification Strategy:** Explain how the success of this plan would be measured.
- **Anticipated Challenges & Considerations:** List potential risks or dependencies.
Your final output should be ONLY this strategic plan.
"""
